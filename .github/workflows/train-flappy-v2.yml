name: Train Flappy PPO v2 - mixed curriculum

on:
  push:
    paths:
      - ".github/workflows/train-flappy-v2.yml"
  workflow_dispatch:
    inputs:
      steps_per_level:
        description: "PPO timesteps per stage (2048 smoke test, 100000+ research)"
        type: choice
        default: "100000"
        options:
          - "2048"
          - "100000"
          - "200000"
          - "400000"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ppo.txt
      - name: Test environment and reward
        run: python -m pytest -q
      - name: Train PPO (mixed replay; seed 1729)
        run: |
          python -m butterfly_rl.train_flappy_v2 --seed 1729 --steps-per-level ${{ inputs.steps_per_level || '2048' }} --validation-episodes 20
      - name: Held-out evaluation (different seeds)
        run: |
          python -m butterfly_rl.evaluate_flappy --input runs/flappy-v2 --output runs/flappy-v2-evaluation --episodes 100
      - name: Save models and honest evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-v2-${{ github.run_id }}
          path: |
            runs/flappy-v2/*.zip
            runs/flappy-v2/manifest.json
            runs/flappy-v2-evaluation/*.json
          retention-days: 30
          if-no-files-found: warn
