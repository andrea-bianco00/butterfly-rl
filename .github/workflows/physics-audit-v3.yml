name: Audit v3 geometry feasibility

on:
  workflow_dispatch:
  push:
    paths:
      - "butterfly_rl/physics_audit.py"
      - "tests/test_physics_audit.py"
      - ".github/workflows/physics-audit-v3.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements-ppo.txt pytest
      - name: Test geometry audit
        run: python -m pytest -q tests/test_physics_audit.py
      - name: Generate reproducible geometry report
        run: python -m butterfly_rl.physics_audit --episodes 200 --seed 7301 --output runs/geometry-audit.json
      - name: Preserve raw report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-v3-geometry-audit-${{ github.run_id }}
          path: runs/geometry-audit.json
          if-no-files-found: warn
