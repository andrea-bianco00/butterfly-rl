name: Stress audit - harder unseen environments

on:
  push:
    paths:
      - ".github/workflows/stress-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ppo.txt
      - name: Run full tests
        run: python -m pytest -q
      - name: Audit 500 unseen stress episodes (untrained oracle)
        run: |
          python -m butterfly_rl.stress_audit --episodes 100 --seed-start 800000 --output runs/stress-audit.json
      - name: Preserve all outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: butterfly-stress-audit-${{ github.run_id }}
          path: runs/stress-audit.json
          if-no-files-found: warn
          retention-days: 30
