name: Study authentic early PPO learning v6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  early-learning:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install genuine simulation and PPO dependencies
        run: python -m pip install -r requirements-ppo.txt
      - name: Train from scratch on unchanged Flappy level, save every 2000 steps
        run: python -m butterfly_rl.train_early_learning_v6 --seed 1729 --steps 100000 --interval 2000 --out runs/flappy-early-v6
      - name: Audit all chronological checkpoints on 20 held-out courses
        run: python -m butterfly_rl.audit_early_learning_v6 --models runs/flappy-early-v6 --out audit/early-v6.json --seeds 20
      - name: Record 100 actual butterfly flights for every milestone
        run: python -m butterfly_rl.record_early_learning_v6 --models runs/flappy-early-v6 --out data/replays/early-v6-1729.json --seed 94001 --count 100 --horizon 650
      - name: Upload verified experiment without modifying live portfolio
        uses: actions/upload-artifact@v4
        with:
          name: genuine-early-ppo-learning-v6
          path: |
            runs/flappy-early-v6/manifest.json
            audit/early-v6.json
            data/replays/early-v6-1729.json
          retention-days: 30
